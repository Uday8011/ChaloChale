<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - ChaloChale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <!-- Navbar Start -->
    <div class="container-fluid p-0">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-plane-departure me-2"></i>ChaloChale</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                        <li class="nav-item"><a class="nav-link" href="Packages.html">Packages</a></li>
                        <li class="nav-item"><a class="nav-link active" href="booking.html">Booking</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                    <div class="d-flex gap-2 ms-lg-3 mt-3 mt-lg-0">
                        <a href="signup.html" class="btn btn-warning">Sign Up</a>
                        <a href="login.html" class="btn btn-warning">Login</a>
                    </div>
                </div>
            </div>
        </nav>
    </div>
    <!-- Navbar End -->

    <section class="py-5">
        <div class="container">
            <h2 class="text-center fw-bold mb-4">Book Your Trip</h2>
            <div class="row justify-content-center">
                <div class="col-12 col-md-8">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <form id="bookingForm">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="fullName" class="form-label">Full Name</label>
                                        <input type="text" class="form-control" id="fullName" name="fullName" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="email" name="email" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="phone" class="form-label">Phone</label>
                                        <input type="tel" class="form-control" id="phone" name="phone" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="destination" class="form-label">Destination</label>
                                        <select id="destination" name="destination" class="form-select" required>
                                            <option value="">Choose...</option>
                                            <option>Agra</option>
                                            <option>Goa</option>
                                            <option>Jaipur</option>
                                            <option>Manali</option>
                                            <option>Shimla</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="package" class="form-label">Package</label>
                                        <select id="package" name="package" class="form-select">
                                            <option value="">Standard</option>
                                            <option>Premium</option>
                                            <option>Luxury</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="checkin" class="form-label">Check-in</label>
                                        <input type="date" class="form-control" id="checkin" name="checkin" required>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="checkout" class="form-label">Check-out</label>
                                        <input type="date" class="form-control" id="checkout" name="checkout" required>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="travelers" class="form-label">Travelers</label>
                                        <input type="number" class="form-control" id="travelers" name="travelers" min="1" value="1" required>
                                    </div>
                                    <div class="col-md-12">
                                        <label for="requests" class="form-label">Special Requests</label>
                                        <textarea class="form-control" id="requests" name="requests" rows="3"></textarea>
                                    </div>
                                </div>

                                <div class="mt-4 d-flex justify-content-between align-items-center">
                                    <div class="text-muted small">We will contact you to confirm the booking.</div>
                                    <div>
                                        <button type="submit" class="btn btn-primary">Submit Booking</button>
                                        <a href="index.html" class="btn btn-secondary ms-2">Cancel</a>
                                    </div>
                                </div>
                            </form>

                            <div id="bookingAlert" class="alert mt-3 d-none" role="alert"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Start -->
    <footer class="site-footer bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; <span id="year"></span> ChaloChale. All rights reserved.</p>
        </div>
    </footer>
    <!-- Footer End -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
    <script>
        // Simple client-side handler: show a success message and reset form
        document.getElementById('bookingForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const alertEl = document.getElementById('bookingAlert');
            alertEl.classList.remove('d-none', 'alert-danger');
            alertEl.classList.add('alert-success');
            alertEl.textContent = 'Thank you! Your booking request has been submitted. We will contact you shortly.';
            // Optionally: collect values or send to backend via fetch
            this.reset();
        });

        // set current year in footer
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
